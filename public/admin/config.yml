backend:
  name: github
  repo: xiaoya1989/Project_BSDLab
  branch: main
  base_url: https://bsd-lab-cms-auth.393649680.workers.dev
  auth_endpoint: auth
  site_domain: bsd-lab.org
  auth_scope: public_repo
  open_authoring: false
  squash_merges: true
  use_graphql: true
  commit_messages:
    create: '内容：新建“{{slug}}”'
    update: '内容：更新“{{slug}}”'
    delete: '内容：删除“{{slug}}”'
    uploadMedia: '图片：上传“{{path}}”'
    deleteMedia: '图片：删除“{{path}}”'
    openAuthoring: '{{message}}（{{author-login}} 提交）'

site_url: https://bsd-lab.org
display_url: https://bsd-lab.org
locale: zh_Hans
publish_mode: editorial_workflow

media_folder: public/posts/uploads
public_folder: /posts/uploads
media_processing:
  enabled: true
  quality: 85
  strip_metadata: true

collections:
  - name: posts
    label: 实验室动态
    label_singular: 动态文章
    description: 编辑中英文动态、上传配图，并提交给网站负责人审核。
    folder: content/posts
    create: true
    delete: false
    extension: md
    format: bsd-post
    identifier_field: title_zh
    slug: '{{fields.slug}}'
    media_folder: /public/posts/{{slug}}
    public_folder: /posts/{{slug}}
    preview_path: '?lang=zh#/news/{{fields.slug}}'
    preview_path_date_field: date
    summary: '{{date}} · {{title_zh}} / {{title_en}}'
    sortable_fields: [date, title_zh, title_en]
    fields:
      - label: 文章网址标识
        name: slug
        widget: string
        hint: 只用英文小写字母、数字和连字符，例如 meg-method-workshop。保存后请不要修改。
        pattern:
          - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - 请输入英文小写字母、数字和单个连字符。
      - label: 活动日期
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
      - label: 中文标题
        name: title_zh
        widget: string
      - label: English title
        name: title_en
        widget: string
      - label: 中文摘要
        name: summary_zh
        widget: text
        hint: 建议一至两句话，用于首页动态卡片。
      - label: English summary
        name: summary_en
        widget: text
        hint: Keep the facts consistent with the Chinese summary.
      - label: 封面图片
        name: cover_image
        widget: image
        choose_url: false
        allow_multiple: false
        hint: 可直接拖拽图片到上传区，或点击选择本地文件；无需填写 URL。建议使用清楚的横版图片，上传时会压缩并移除图片元数据。
        media_library:
          config:
            max_file_size: 1572864
      - label: 微信封面图片
        name: wechat_cover_image
        widget: image
        required: false
        choose_url: false
        allow_multiple: false
        hint: 可直接拖拽图片到上传区，或点击选择本地文件；无需填写 URL。暂不创建微信草稿时可以留空。
        media_library:
          config:
            max_file_size: 1572864
      - label: 封面跳转链接
        name: cover_link
        widget: string
        required: false
        hint: 如需让动态正文页的整张封面可以点击，请填写完整的 https:// 地址；不需要跳转时留空。
        pattern:
          - '^https://[^\s]+$'
          - 请输入完整的 https:// 地址。
      - label: 内容标签
        name: tags
        widget: list
        min: 1
        max: 6
        hint: 每个标签按回车确认，例如 academic lecture、MEG。
      - label: 中文正文
        name: body_zh
        widget: markdown
        modes: [rich_text, raw]
        minimal: false
        editor_components: [bsd-upload-image]
        hint: 点击工具栏中的“拖拽上传图片”，把图片拖到上传区或选择本地文件；无需填写 URL。请填写能说明内容的替代文字。
      - label: English body
        name: body_en
        widget: markdown
        modes: [rich_text, raw]
        minimal: false
        editor_components: [bsd-upload-image]
        hint: Use “拖拽上传图片” in the toolbar, then drop an image into the upload area or choose a local file. Keep names, dates, organizations, and claims consistent with the Chinese version.
      - label: 创建微信草稿
        name: publish_to_wechat
        widget: hidden
        default: false

  - name: member_profiles
    label: 成员资料管理
    label_singular: 成员资料
    description: 供指定的网站内容编辑统一维护成员公开资料。请选择需要更新的成员，每次只处理一份明确的修改申请，并提交给网站负责人审核。
    format: bsd-member-json
    editor:
      preview: true
    files:
      - name: jianan-zhu
        label: 朱嘉楠 / Jianan Zhu
        file: team_members/Jianan-Zhu/profile.json
        fields: &member_profile_fields
          - label: 英文姓名
            name: name
            widget: string
            hint: 用于英文页面，请使用公开使用的姓名拼写。
          - label: 中文姓名
            name: name_cn
            widget: string
          - label: 成员身份
            name: role
            widget: select
            options:
              - { label: 硕士生 / Master Student, value: MASTER STUDENT }
              - { label: 博士生 / PhD Student, value: PHD STUDENT }
              - { label: 博士后 / Postdoctoral Researcher, value: POSTDOCTORAL RESEARCHER }
              - { label: 往届成员 / Alumni, value: ALUMNI }
          - label: 专业或研究方向
            name: program
            widget: string
            hint: 建议使用简短的英文名称，例如 Neuroscience。
          - label: 入学年份
            name: enrollment_year
            widget: number
            value_type: int
            min: 1900
            max: 2200
            required: false
          - label: 毕业年份
            name: graduation_year
            widget: number
            value_type: int
            min: 1900
            max: 2200
            required: false
          - label: 前一培养阶段入学年份
            name: masters_enrollment_year
            widget: number
            value_type: int
            min: 1900
            max: 2200
            required: false
            hint: 仅在同一成员需要同时展示硕士、博士两个阶段时填写。
          - label: 前一培养阶段毕业年份
            name: masters_graduation_year
            widget: number
            value_type: int
            min: 1900
            max: 2200
            required: false
            hint: 仅在同一成员需要同时展示硕士、博士两个阶段时填写。
          - label: 毕业后去向
            name: next_destination
            widget: string
            required: false
            hint: 仅填写已确认可以公开的机构名称，例如 Donders Institute。
          - label: 公开邮箱
            name: email
            widget: string
            hint: 此邮箱会显示在公开网站上，请只填写确认可以公开的地址。
            pattern:
              - '^[^ @]+@[^ @]+[.][^ @]+$'
              - 请输入有效的邮箱地址。
          - label: 研究关键词
            name: keywords
            widget: list
            min: 1
            max: 8
            hint: 每个关键词按回车确认，建议使用英文。
          - label: 卡片简介
            name: bio_short
            widget: text
            hint: 一句简洁的英文介绍，显示在团队成员卡片上。
          - label: 详细简介
            name: bio_long
            widget: text
            hint: 一小段英文介绍，可包括研究问题、方法和当前课题；不要填写未公开研究结果。
          - label: 公开链接
            name: links
            widget: object
            collapsed: false
            fields:
              - { label: Google Scholar, name: google_scholar, widget: string, required: false }
              - { label: 个人网站, name: personal_website, widget: string, required: false }
              - { label: GitHub, name: github, widget: string, required: false }
      - name: mingxia-yang
        label: 杨铭霞 / Mingxia Yang
        file: team_members/Mingxia-Yang/profile.json
        fields: *member_profile_fields
      - name: tingyu-zhou
        label: 周廷玉 / Tingyu Zhou
        file: team_members/Tingyu-Zhou/profile.json
        fields: *member_profile_fields
      - name: dingxian-huang
        label: 黄定贤 / Dingxian Huang
        file: team_members/dingxian-huang/profile.json
        fields: *member_profile_fields
      - name: dongdong-chen
        label: 陈冬冬 / Dongdong Chen
        file: team_members/dongdong-chen/profile.json
        fields: *member_profile_fields
      - name: eve-zeng
        label: 曾奕彤 / Yitong Zeng
        file: team_members/eve-zeng/profile.json
        fields: *member_profile_fields
      - name: shengpei-zhao
        label: 赵晟培 / Shengpei Zhao
        file: team_members/shengpei-zhao/profile.json
        fields: *member_profile_fields
      - name: wei-song
        label: 宋伟 / Wei Song
        file: team_members/wei-song/profile.json
        fields: *member_profile_fields
      - name: xiaoyu-deng
        label: 邓晓雨 / Xiaoyu Deng
        file: team_members/xiaoyu-deng/profile.json
        fields: *member_profile_fields
      - name: xuantao-zhang
        label: 张轩涛 / Xuantao Zhang
        file: team_members/xuantao-zhang/profile.json
        fields: *member_profile_fields
      - name: yihua-chen
        label: 陈依华 / Yihua Chen
        file: team_members/yihua-chen/profile.json
        fields: *member_profile_fields
      - name: yue-pan
        label: 潘玥 / Yue Pan
        file: team_members/yue-pan/profile.json
        fields: *member_profile_fields
      - name: yuxiang-ma
        label: 马宇翔 / Yuxiang Ma
        file: team_members/yuxiang-ma/profile.json
        fields: *member_profile_fields
